name: Web CI
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pr-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check the pull request file count
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: >
          details=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq
          '[.head.sha, .base.sha, .base.ref, .changed_files] | @tsv')

          IFS=$'\t' read -r head base base_ref file_count <<< "$details"

          if [[ "$head" != "$PR_HEAD" || "$base" != "$PR_BASE" || "$base_ref" !=
          "$PR_BASE_REF" || ! "$file_count" =~ ^[0-9]+$ ]]; then
            echo '::error::Could not verify the changed-file count for this pull request revision.'
            exit 1
          fi

          echo "Files changed: $file_count"

          if (( file_count > 100 )); then
            echo '::error::This pull request exceeds the 100-file maximum. Split the change into smaller PRs.'
            exit 1
          elif (( file_count > 80 )); then
            if [[ "$PR_ACTION" == opened ]]; then
              echo '::error::Open new pull requests with at most 80 changed files. Reserve the remaining 20 for review fixes.'
              exit 1
            fi
            echo '::warning::This pull request uses the file reserve for review fixes. Keep unrelated changes in a separate pull request.'
          fi
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    timeout-minutes: 15
    steps:
      - &a1
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122
        with:
          php-version: "8.4"
          extensions: dom, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          coverage: none
      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: "24"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: composer test
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
  browser:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122
        with:
          php-version: "8.4"
          extensions: dom, fileinfo, gd, intl, mbstring, pdo_mysql
          coverage: none
      - uses: actions/setup-node@66f83c8206e0997178c8fd7bf1da9efccf5dd388
        with:
          node-version: "24"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
  check:
    if: always()
    needs:
      - scope
      - pr-files
      - tests
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable phase checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
        run: >
          echo "$RESULTS" | jq -e --arg event "$EVENT" --arg runtime "$RUNTIME"
          '
            .scope.result == "success" and ($runtime == "true" or $runtime == "false")
            and (."pr-files".result == (if $event == "pull_request" then "success" else "skipped" end))
            and ([.tests.result, .browser.result]
              | all(. == (if $runtime == "true" then "success" else "skipped" end)))'
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.source.outputs.runtime }}
    steps:
      - *a1
      - id: source
        name: Detect the published runtime and its test entry points
        shell: bash
        run: >
          paths=(artisan composer.json composer.lock package.json
          package-lock.json phpunit.xml tests/bootstrap.php playwright.config.ts
          scripts/browser-server.mjs)

          present=0

          for file in "${paths[@]}"; do
            if [[ -e "$file" || -L "$file" ]]; then
              [[ -f "$file" && -s "$file" && ! -L "$file" ]]
              present=$((present + 1))
            fi
          done

          if (( present == 0 )); then
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
            echo 'Verified the presentation and CI foundation phase.'
          elif (( present == ${#paths[@]} )); then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Publish the runtime and its test entry points together.'
            exit 1
          fi
